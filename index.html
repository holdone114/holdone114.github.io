<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#2563eb;--ok:#16a34a;--ng:#dc2626;--line:#e5e7eb}

.lang button.on{background:var(--pri);color:#fff;border-color:var(--pri)}.lvl button.on{background:#dbeafe;border-color:#93c5fd;color:#1e40af}
main{max-width:760px;margin:0 auto;padding:12px}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

.muted{color:var(--mut)}.small{font-size:15px}.warn{color:var(--ng)}
.hero{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border-radius:18px;padding:16px;font-size:18px}.hero .muted{color:#e0e7ff;font-size:15px}
.bar,.mini{height:10px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden;margin:8px 0}.bar i,.mini i{display:block;height:100%;background:#fde047}

.back{border:none;background:#e5e7eb;border-radius:10px;padding:8px 12px;font-size:16px}

.row{display:flex;gap:10px;align-items:flex-start}.tx{flex:1;min-width:0}
.spk{border:none;background:#eff6ff;border-radius:50%;width:46px;height:46px;font-size:22px;flex:none}

</style></head><body>

function parseData(txt){
  const topics=[];let t=null,sec=null,n=0;
  for(const raw of txt.split('\n')){
    const line=raw.trim(); if(!line) continue;
    if(line.startsWith('## ')){const f=line.slice(3).split('|').map(s=>s.trim());t={id:f[0],name:f[1],icon:f[2],group:f[3],items:[],dialogs:[]};topics.push(t);n=0;continue;}
    if(line.startsWith('# ')){const f=line.slice(2).split('|').map(s=>s.trim());const k=f[0];sec={kind:k[0],lvl:+k[1]};
      if(sec.kind==='d'){sec.d={lvl:sec.lvl,roles:(f[1]||'A, B').split(',').map(s=>s.trim()),lines:[]};t.dialogs.push(sec.d);} continue;}
    const f=line.split('|').map(s=>s.trim());
    if(sec.kind==='d'){ if(f.length!==7) throw new Error('dialog fields '+f.length+': '+line);
      sec.d.lines.push({sp:f[0],ko:f[1],en:f[2],ja:f[3],kana:f[4]||f[3],zh:f[5],py:f[6]});
    } else { if(f.length!==6) throw new Error('item fields '+f.length+': '+line);
      t.items.push({id:t.id+'-'+(n++),topic:t.id,type:sec.kind,lvl:sec.lvl,ko:f[0],en:f[1],ja:f[2],kana:f[3]||f[2],zh:f[4],py:f[5]});}
  }
  return topics;
}

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.marks)return Object.assign({lang:'en',level:'all',rate:0.9,showKo:true,marks:{en:{},ja:{},zh:{}}},s);}catch(e){}return {lang:'en',level:'all',rate:0.9,showKo:true,marks:{en:{},ja:{},zh:{}}};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ALL=TOPICS.flatMap(t=>t.items);const BYID={};ALL.forEach(i=>BYID[i.id]=i);
const tById=id=>TOPICS.find(t=>t.id===id);
const cache={};
function reading(it){const L=S.lang;if(L==='en')return {main:'',sub:''};
  const k=L+':'+(L==='ja'?it.kana:it.py);if(!cache[k]){if(L==='ja'){const c=kanaConv(it.kana);cache[k]={main:it.kana!==it.ja?it.kana:'',sub:c.romaji,ko:c.ko};}else cache[k]={main:it.py,sub:'',ko:pinyinConv(it.py)};}
  return cache[k];}
const tgt=it=>it[S.lang];
function speakText(it){if(S.lang==='ja'&&it.type==='v')return it.kana.replace(/\s+/g,'');return tgt(it);}
// ===== speech =====
let voices=[];function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function pickVoice(code){const lc=code.toLowerCase();const vs=voices.filter(v=>(v.lang||'').replace('_','-').toLowerCase().startsWith(lc.slice(0,2)));
  return vs.find(v=>v.lang.replace('_','-').toLowerCase()===lc&&/google|siri|natural|premium|enhanced/i.test(v.name))||vs.find(v=>v.lang.replace('_','-').toLowerCase()===lc)||(lc.startsWith('zh')?vs.find(v=>/cn|hans|mandarin/i.test(v.lang+v.name)):null)||vs[0]||null;}
function speak(text,onend){if(!window.speechSynthesis){toast('이 브라우저는 음성 기능을 지원하지 않아요');onend&&onend();return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[～~]/g,''));const code=LANGS[S.lang].tts;u.lang=code;u.rate=S.rate;
  const v=pickVoice(code);if(v)u.voice=v;else if(voices.length)toast(LANGS[S.lang].name+' 음성이 기기에 없을 수 있어요');
  let done=false;const fin=()=>{if(!done){done=true;onend&&onend();}};u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);}
function stopSpeak(){try{speechSynthesis.cancel();}catch(e){}playToken++;}
let playToken=0;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200);}
// ===== progress =====
const M=()=>S.marks[S.lang];
function mark(id,ok){const m=M()[id]||{b:0,w:0};if(ok){m.b=Math.min((m.b||0)+1,5);}else{m.b=0;m.w=(m.w||0)+1;}m.d=Date.now()+INTERVAL[m.b]*DAY;m.t=Date.now();M()[id]=m;save();updateBadge();}
const isKnown=id=>(M()[id]||{}).b>=1;
const isReview=id=>{const m=M()[id];return m&&(m.b===0||m.d<=Date.now());};
function reviewItems(){return ALL.filter(i=>isReview(i.id)).sort((a,b)=>(M()[a.id].b-M()[b.id].b)||(M()[b.id].w-M()[a.id].w));}
function updateBadge(){const n=reviewItems().length;const b=$('#revBadge');b.textContent=n;b.style.display=n?'inline-block':'none';}
const lvlFilter=items=>S.level==='all'?items:items.filter(i=>i.lvl==+S.level);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// ===== router =====
let view={name:'home'};
function go(v){stopSpeak();view=v;render();window.scrollTo(0,0);}
function render(){
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===S.lang));
  document.querySelectorAll('.lvl button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.level));
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('on',b.dataset.go===(view.name==='topic'||view.name==='chart'||view.name==='pinyin'?'home':view.name)));
  const el=$('#main');
  ({home:renderHome,topic:renderTopic,review:renderReview,settings:renderSettings,chart:renderChart,pinyin:renderPinyin}[view.name])(el);
  updateBadge();
}
function pct(items){if(!items.length)return 0;return Math.round(items.filter(i=>isKnown(i.id)).length/items.length*100);}
function renderHome(el){
  const items=lvlFilter(ALL);const k=items.filter(i=>isKnown(i.id)).length;
  let h=`<div class="hero"><div><b>${LANGS[S.lang].flag} ${LANGS[S.lang].name}</b> · ${LVL[S.level]}</div><div class="bar"><i style="width:${pct(items)}%"></i></div><div class="muted">알아요 ${k} / ${items.length}개 · 복습할 항목 ${reviewItems().length}개</div></div>`;
  const card=t=>{const it=lvlFilter(t.items);return `<button class="tcard" data-t="${t.id}"><span class="ic">${t.icon}</span><span class="tn">${esc(t.name)}</span><span class="tc">${it.length}개 · ${pct(it)}%</span><span class="mini"><i style="width:${pct(it)}%"></i></span></button>`;};
  h+=`<h2>기초</h2><div class="grid">`;
  if(S.lang==='ja')h+=`<button class="tcard" data-v="chart"><span class="ic">あ</span><span class="tn">히라가나·가타카나</span><span class="tc">문자표</span></button>`;
  if(S.lang==='zh')h+=`<button class="tcard" data-v="pinyin"><span class="ic">ā</span><span class="tn">병음·성조 기초</span><span class="tc">발음 규칙</span></button>`;
  h+=TOPICS.filter(t=>t.group==='basic').map(card).join('')+`</div><h2>상황별 회화</h2><div class="grid">`+TOPICS.filter(t=>t.group==='sit').map(card).join('')+`</div>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>go({name:'topic',id:b.dataset.t,mode:'list'}));
  el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go({name:b.dataset.v}));
}
const MODES=[['list','📖 목록'],['card','🃏 카드'],['dialog','💬 대화'],['quiz','❓ 퀴즈'],['listen','🎧 듣기']];
function renderTopic(el){
  const t=tById(view.id);const items=lvlFilter(t.items);
  let h=`<div class="thead"><button class="back">‹ 목록</button><h1>${t.icon} ${esc(t.name)}</h1><span class="muted">${pct(items)}%</span></div><div class="modes">${MODES.map(([m,n])=>`<button data-m="${m}" class="${view.mode===m?'on':''}">${n}</button>`).join('')}</div><div id="pane"></div>`;
  el.innerHTML=h;el.querySelector('.back').onclick=()=>go({name:'home'});
  el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>go({name:'topic',id:t.id,mode:b.dataset.m}));
  const pane=$('#pane');
  if(!items.length&&view.mode!=='dialog'){pane.innerHTML='<p class="empty">이 단계에는 항목이 없어요.</p>';return;}
  ({list:paneList,card:paneCard,dialog:paneDialog,quiz:paneQuiz,listen:paneListen}[view.mode])(pane,items,t);
}
function itemHTML(it,opts={}){const r=reading(it);const m=M()[it.id];const st=m?(m.b>=1?'k':'u'):'';
  return `<div class="item ${st}" data-id="${it.id}"><div class="row"><button class="spk" data-say="${it.id}" aria-label="듣기">🔊</button><div class="tx"><div class="tg">${esc(tgt(it))}</div>${r.main?`<div class="rd">${esc(r.main)}</div>`:''}${r.sub?`<div class="ro">${esc(r.sub)}</div>`:''}${r.ko?`<div class="kr">[${esc(r.ko)}]</div>`:''}<div class="ko">${esc(it.ko)}</div>${opts.where?`<div class="muted small">${esc(tById(it.topic).name)} · ${LVL[it.lvl]}</div>`:''}</div></div><div class="mk"><button class="no" data-mk="0">모르겠어요</button><button class="yes" data-mk="1">알아요</button></div></div>`;}
function bindItems(root){root.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(speakText(BYID[b.dataset.say])));
  root.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{const d=b.closest('.item');mark(d.dataset.id,b.dataset.mk==='1');d.classList.remove('k','u');d.classList.add(b.dataset.mk==='1'?'k':'u');});}
function paneList(p,items){const sec=(type,lvl)=>items.filter(i=>i.type===type&&i.lvl===lvl);let h='';
  for(const lvl of [1,2])for(const [ty,nm] of [['v','단어'],['p','표현']]){const a=sec(ty,lvl);if(a.length)h+=`<h3>${LVL[lvl]} ${nm} <span class="muted">${a.length}</span></h3>`+a.map(i=>itemHTML(i)).join('');}
  p.innerHTML=h;bindItems(p);}
// ---- cards
function paneCard(p,items,t,title){let deck=items.slice(),idx=0,flip=false,rev=false,auto=true;
  function draw(){if(idx>=deck.length){p.innerHTML=`<div class="done">🎉 카드를 다 봤어요!<br><span class="muted">알아요 ${deck.filter(i=>isKnown(i.id)).length} / ${deck.length}</span><div class="btns"><button class="pri" id="again">다시 하기</button></div></div>`;$('#again').onclick=()=>{idx=0;draw();};return;}
    const it=deck[idx];const r=reading(it);
    const front=rev?`<div class="ko big">${esc(it.ko)}</div><div class="muted">${LANGS[S.lang].name}로 뭐라고 할까요?</div>`:`<div class="tg big">${esc(tgt(it))}</div>`;
    const back=`<div class="tg">${esc(tgt(it))}</div>${r.main?`<div class="rd">${esc(r.main)}</div>`:''}${r.sub?`<div class="ro">${esc(r.sub)}</div>`:''}${r.ko?`<div class="kr">[${esc(r.ko)}]</div>`:''}<div class="ko big">${esc(it.ko)}</div>`;
    p.innerHTML=`<div class="opts"><label><input type="checkbox" id="rev" ${rev?'checked':''}> 한국어 먼저</label><label><input type="checkbox" id="auto" ${auto?'checked':''}> 자동 발음</label><button id="shuf">🔀 섞기</button></div>
    <div class="muted ctr">${idx+1} / ${deck.length}</div><div class="fcard ${flip?'flip':''}" id="fc">${flip?back:front}<div class="hint">${flip?'':'탭해서 뒤집기'}</div></div>
    <div class="btns"><button id="say">🔊 듣기</button></div><div class="btns"><button class="no lg" id="no">모르겠어요</button><button class="yes lg" id="yes">알아요</button></div><div class="btns"><button id="prev">‹ 이전</button><button id="next">다음 ›</button></div>`;
    $('#fc').onclick=()=>{flip=!flip;draw();if(flip&&auto)speak(speakText(it));};
    $('#say').onclick=()=>speak(speakText(it));
    $('#rev').onchange=e=>{rev=e.target.checked;flip=false;draw();};$('#auto').onchange=e=>{auto=e.target.checked;};
    $('#shuf').onclick=()=>{deck=shuffle(deck);idx=0;flip=false;draw();};
    const nx=ok=>{if(ok!==undefined)mark(it.id,ok);idx++;flip=false;draw();if(!rev&&auto&&deck[idx])speak(speakText(deck[idx]));};
    $('#yes').onclick=()=>nx(true);$('#no').onclick=()=>nx(false);$('#next').onclick=()=>nx();$('#prev').onclick=()=>{if(idx>0){idx--;flip=false;draw();}};
  }draw();}
// ---- dialogs
function paneDialog(p,items,t){const ds=t.dialogs.filter(d=>S.level==='all'||d.lvl==+S.level);
  if(!ds.length){p.innerHTML='<p class="empty">이 단계의 대화가 없어요. 단계를 "전체"로 바꿔 보세요.</p>';return;}
  let h=`<div class="opts"><label><input type="checkbox" id="sko" ${S.showKo?'checked':''}> 한국어 뜻 보기</label></div>`;
  ds.forEach((d,di)=>{h+=`<div class="dlg"><div class="dh"><b>${LVL[d.lvl]} 대화</b> <span class="muted">${esc(d.roles.join(' ↔ '))}</span><button class="pri sm" data-play="${di}">▶ 전체 듣기</button></div>`;
    d.lines.forEach((l,li)=>{const r=reading(l);const role=l.sp==='A'?d.roles[0]:d.roles[1];h+=`<div class="bub ${l.sp==='A'?'a':'b'}" data-d="${di}" data-l="${li}"><div class="who">${esc(role||l.sp)}</div><div class="tg">${esc(l[S.lang])}</div>${r.main?`<div class="rd">${esc(r.main)}</div>`:''}${r.ko?`<div class="kr">[${esc(r.ko)}]</div>`:''}${S.showKo?`<div class="ko">${esc(l.ko)}</div>`:''}</div>`;});h+='</div>';});
  p.innerHTML=h;$('#sko').onchange=e=>{S.showKo=e.target.checked;save();paneDialog(p,items,t);};
  p.querySelectorAll('.bub').forEach(b=>b.onclick=()=>{stopSpeak();hl(b);speak(ds[b.dataset.d].lines[b.dataset.l][S.lang],()=>b.classList.remove('play'));});
  function hl(b){p.querySelectorAll('.bub.play').forEach(x=>x.classList.remove('play'));b.classList.add('play');}
  p.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{stopSpeak();const tok=playToken;const di=+b.dataset.play;const lines=ds[di].lines;let i=0;
    const step=()=>{if(tok!==playToken||i>=lines.length){p.querySelectorAll('.bub.play').forEach(x=>x.classList.remove('play'));return;}const el=p.querySelector(`.bub[data-d="${di}"][data-l="${i}"]`);hl(el);el.scrollIntoView({block:'center',behavior:'smooth'});speak(lines[i][S.lang],()=>{i++;setTimeout(step,600);});};step();});
}
// ---- quiz
function paneQuiz(p,items,t,listenOnly){const pool=items.length>=4?items:ALL;let type=listenOnly?'listen':'meaning';
  function start(){const qs=shuffle(items).slice(0,10);let qi=0,score=0;
    function q(){if(qi>=qs.length){p.innerHTML=`<div class="done">점수 <b>${score} / ${qs.length}</b><br><span class="muted">틀린 문제는 복습 목록에 추가됐어요.</span><div class="btns"><button class="pri" id="again">다시 풀기</button></div></div>`;$('#again').onclick=start;return;}
      const it=qs[qi];const same=pool.filter(x=>x.id!==it.id&&x.type===it.type);const others=shuffle(same.length>=3?same:pool.filter(x=>x.id!==it.id)).filter((x,i,a)=>a.findIndex(y=>y.ko===x.ko)===i&&x.ko!==it.ko).slice(0,3);
      const opts=shuffle([it,...others]);const showT=type==='phrase';
      const qhtml=type==='meaning'?`<div class="tg big">${esc(tgt(it))}</div><div class="muted">뜻이 무엇일까요?</div>`:type==='phrase'?`<div class="ko big">${esc(it.ko)}</div><div class="muted">${LANGS[S.lang].name}로 알맞은 것은?</div>`:`<button class="pri xl" id="replay">🔊 다시 듣기</button><div class="muted">듣고 뜻을 고르세요</div>`;
      p.innerHTML=(listenOnly?'':`<div class="opts seg">${[['meaning','뜻 고르기'],['phrase','표현 고르기'],['listen','듣고 고르기']].map(([k,n])=>`<button data-qt="${k}" class="${type===k?'on':''}">${n}</button>`).join('')}</div>`)+`<div class="muted ctr">${qi+1} / ${qs.length} · 맞힌 개수 ${score}</div><div class="qbox">${qhtml}</div><div class="choices">${opts.map(o=>`<button class="ch" data-id="${o.id}">${esc(showT?tgt(o):o.ko)}</button>`).join('')}</div><div id="fb"></div>`;
      p.querySelectorAll('[data-qt]').forEach(b=>b.onclick=()=>{type=b.dataset.qt;start();});
      if(type==='listen'){speak(speakText(it));$('#replay').onclick=()=>speak(speakText(it));}
      let answered=false;
      p.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const ok=b.dataset.id===it.id;if(ok)score++;mark(it.id,ok);
        p.querySelectorAll('.ch').forEach(x=>{if(x.dataset.id===it.id)x.classList.add('right');else if(x===b)x.classList.add('wrong');});
        const r=reading(it);$('#fb').innerHTML=`<div class="fbk ${ok?'ok':'ng'}">${ok?'⭕ 정답!':'❌ 오답'}<div class="tg">${esc(tgt(it))}</div>${r.main?`<div class="rd">${esc(r.main)}</div>`:''}${r.ko?`<div class="kr">[${esc(r.ko)}]</div>`:''}<div class="ko">${esc(it.ko)}</div></div><div class="btns"><button id="say2">🔊</button><button class="pri" id="nq">다음 ›</button></div>`;
        if(type!=='listen')speak(speakText(it));$('#say2').onclick=()=>speak(speakText(it));$('#nq').onclick=()=>{qi++;q();};});
    }q();}
  start();}
// ---- listening
function paneListen(p,items,t){let sub='quiz';
  function draw(){p.innerHTML=`<div class="opts seg"><button data-s="quiz" class="${sub==='quiz'?'on':''}">듣고 뜻 고르기</button><button data-s="auto" class="${sub==='auto'?'on':''}">연속 듣기</button></div><div id="lp"></div>`;
    p.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{stopSpeak();sub=b.dataset.s;draw();});
    const lp=$('#lp');if(sub==='quiz')paneQuiz(lp,items,t,true);else autoPlay(lp,items);}
  draw();}
function autoPlay(p,items){let hide=false,rep=1;
  p.innerHTML=`<div class="opts"><label><input type="checkbox" id="hide"> 글자 가리기</label><label>반복 <select id="rep"><option>1</option><option>2</option><option>3</option></select>회</label></div><div class="btns"><button class="pri" id="go">▶ 재생</button><button id="st">■ 정지</button></div><div id="cur" class="fcard"></div><div class="muted ctr" id="pc"></div>`;
  $('#hide').onchange=e=>hide=e.target.checked;$('#rep').onchange=e=>rep=+e.target.value;
  $('#st').onclick=stopSpeak;
  $('#go').onclick=()=>{stopSpeak();const tok=playToken;let i=0,r=0;
    const step=()=>{if(tok!==playToken)return;if(i>=items.length){$('#pc').textContent='끝!';return;}const it=items[i];const rd=reading(it);
      $('#cur').innerHTML=hide?`<div class="ko big">${esc(it.ko)}</div><div class="muted">(글자 가림)</div>`:`<div class="tg big">${esc(tgt(it))}</div>${rd.main?`<div class="rd">${esc(rd.main)}</div>`:''}${rd.ko?`<div class="kr">[${esc(rd.ko)}]</div>`:''}<div class="ko">${esc(it.ko)}</div>`;
      $('#pc').textContent=`${i+1} / ${items.length}`;
      speak(speakText(it),()=>{r++;if(r>=rep){r=0;i++;}setTimeout(step,1200);});};step();};}
// ===== review
function renderReview(el){const items=lvlFilter(reviewItems());
  el.innerHTML=`<div class="thead"><h1>🔁 복습</h1><span class="muted">${LANGS[S.lang].name} · ${items.length}개</span></div><p class="muted">'모르겠어요'를 누르거나 퀴즈에서 틀린 항목, 그리고 복습할 날짜가 된 항목이 여기에 모여요. '알아요'를 누를 때마다 다음 복습 간격이 1→3→7→14→30일로 늘어나요.</p>${items.length?`<div class="modes"><button data-m="card" class="${view.mode==='card'?'on':''}">🃏 카드</button><button data-m="quiz" class="${view.mode==='quiz'?'on':''}">❓ 퀴즈</button><button data-m="list" class="${!view.mode||view.mode==='list'?'on':''}">📖 목록</button></div>`:''}<div id="pane"></div>`;
  el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>go({name:'review',mode:b.dataset.m}));
  const p=$('#pane');if(!items.length){p.innerHTML='<p class="empty">복습할 항목이 없어요. 👍<br>학습 중 모르는 것을 "모르겠어요"로 표시해 보세요.</p>';return;}
  if(view.mode==='card')paneCard(p,items);else if(view.mode==='quiz')paneQuiz(p,items);else{p.innerHTML=items.map(i=>itemHTML(i,{where:1})).join('');bindItems(p);}}
// ===== settings
function renderSettings(el){const counts=l=>{const m=S.marks[l];const ids=Object.keys(m);return `${LANGS[l].flag} ${LANGS[l].name}: 알아요 ${ids.filter(i=>m[i].b>=1).length} · 복습 ${ids.filter(i=>m[i].b===0||m[i].d<=Date.now()).length}`;};
  const vs=['en','ja','zh'].map(l=>{const v=pickVoice(LANGS[l].tts);return `${LANGS[l].flag} ${LANGS[l].name}: ${v?esc(v.name):'<span class="warn">음성을 찾지 못했어요</span>'}`;}).join('<br>');
  el.innerHTML=`<div class="thead"><h1>⚙️ 설정</h1></div>
  <div class="box"><b>말하기 속도</b> <span id="rv">${S.rate.toFixed(1)}배</span><input type="range" id="rate" min="0.5" max="1.3" step="0.1" value="${S.rate}"><div class="btns"><button id="test">🔊 테스트</button></div></div>
  <div class="box"><b>기기 음성</b><div class="small">${vs}</div><div class="muted small">음성이 없으면 Windows: 설정 › 시간 및 언어 › 음성에서 언어 음성 추가, iPhone: 설정 › 손쉬운 사용 › 콘텐츠 읽기 › 음성에서 추가하세요.</div></div>
  <div class="box"><b>학습 기록</b><div class="small">${['en','ja','zh'].map(counts).join('<br>')}</div><div class="muted small">기록은 이 기기의 이 브라우저에만 저장돼요.</div><div class="btns"><button class="no" id="reset">현재 언어 기록 초기화</button></div></div>
  <div class="box small muted">총 ${ALL.length}개 항목 × 3개 언어 · 대화 ${TOPICS.reduce((a,t)=>a+t.dialogs.length,0)}개. 일본어 한글 발음과 로마자, 중국어 한글 발음은 자동으로 만든 근사치라 실제 발음은 🔊로 확인하세요.</div>`;
  $('#rate').oninput=e=>{S.rate=+e.target.value;$('#rv').textContent=S.rate.toFixed(1)+'배';save();};
  $('#test').onclick=()=>speak({en:'Hello, nice to meet you.',ja:'こんにちは、はじめまして。',zh:'你好，很高兴认识你。'}[S.lang]);
  $('#reset').onclick=()=>{if(confirm(LANGS[S.lang].name+' 학습 기록을 모두 지울까요?')){S.marks[S.lang]={};save();render();toast('초기화했어요');}};
  if(!voices.length)setTimeout(()=>{loadVoices();if(view.name==='settings'&&voices.length)renderSettings(el);},800);}
// ===== kana chart
const GOJU=['あいうえお','かきくけこ','さしすせそ','たちつてと','なにぬねの','はひふへほ','まみむめも','や ゆ よ','らりるれろ','わ   を','ん    '];
const DAKU=['がぎぐげご','ざじずぜぞ','だぢづでど','ばびぶべぼ','ぱぴぷぺぽ'];
const YOON=['きゃきゅきょ','しゃしゅしょ','ちゃちゅちょ','にゃにゅにょ','ひゃひゅひょ','みゃみゅみょ','りゃりゅりょ','ぎゃぎゅぎょ','じゃじゅじょ','びゃびゅびょ','ぴゃぴゅぴょ'];
const kata=s=>s.replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
function renderChart(el){let k=view.k||'h';const cv=s=>k==='k'?kata(s):s;
  const cell=c=>{if(!c.trim())return '<div class="kc empty"></div>';const x=kanaConv(c,1);return `<button class="kc" data-s="${c}"><b>${cv(c)}</b><span>${x.romaji}</span><span class="kk">${x.ko}</span></button>`;};
  const rows=(arr,n)=>arr.map(r=>{const cs=n===5?[...r]:r.match(/../g);return `<div class="krow c${n}">${cs.map(cell).join('')}</div>`;}).join('');
  el.innerHTML=`<div class="thead"><button class="back">‹ 목록</button><h1>${k==='h'?'히라가나':'가타카나'}</h1></div><div class="opts seg"><button data-k="h" class="${k==='h'?'on':''}">히라가나 あ</button><button data-k="k" class="${k==='k'?'on':''}">가타카나 ア</button></div>
  <p class="muted small">글자를 누르면 발음을 들을 수 있어요. ${k==='h'?'히라가나는 일본어의 기본 문자예요.':'가타카나는 외래어(コーヒー 커피, ホテル 호텔 등)에 써요. 장음은 ー로 표시해요.'}</p>
  <h3>기본 (오십음)</h3>${rows(GOJU,5)}<h3>탁음·반탁음 (゛゜)</h3>${rows(DAKU,5)}<h3>요음 (작은 ゃゅょ)</h3>${rows(YOON,3)}
  <div class="box small"><b>알아두면 좋은 규칙</b><br>• 작은 っ(ッ): 다음 소리를 한 박자 멈춤 — きって(킷테, 우표)<br>• ん: 받침 ㄴ/ㅁ/ㅇ처럼 한 박자 — ほん(혼, 책)<br>• 장음: おかあさん(오카-산), コーヒー(코-히-)<br>• 조사 は는 "와", へ는 "에", を는 "오"로 읽어요.</div>`;
  el.querySelector('.back').onclick=()=>go({name:'home'});
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>go({name:'chart',k:b.dataset.k}));
  el.querySelectorAll('.kc[data-s]').forEach(b=>b.onclick=()=>{const s=b.dataset.s;speak(s==='を'?'を':s);});}
// ===== pinyin
function renderPinyin(el){const ex=(hz,py,ko)=>`<button class="pex" data-z="${hz}"><b>${hz}</b><span>${py}</span><span class="kk">${ko}</span></button>`;
  const ini=[['b','ㅃ','爸 bà'],['p','ㅍ','怕 pà'],['m','ㅁ','妈 mā'],['f','f(ㅍ)','发 fā'],['d','ㄸ','大 dà'],['t','ㅌ','他 tā'],['n','ㄴ','你 nǐ'],['l','ㄹ','来 lái'],['g','ㄲ','哥 gē'],['k','ㅋ','开 kāi'],['h','ㅎ','好 hǎo'],['j','ㅈ','鸡 jī'],['q','ㅊ','七 qī'],['x','ㅆ/ㅅ','西 xī'],['zh','ㅈ(혀 말기)','中 zhōng'],['ch','ㅊ(혀 말기)','吃 chī'],['sh','ㅅ(혀 말기)','是 shì'],['r','ㄹ(혀 말기)','热 rè'],['z','ㅉ','在 zài'],['c','ㅊ','菜 cài'],['s','ㅆ','四 sì']];
  el.innerHTML=`<div class="thead"><button class="back">‹ 목록</button><h1>병음·성조 기초</h1></div>
  <div class="box"><b>병음(pinyin)</b>은 한자의 발음을 로마자로 적은 것이고, 모음 위의 기호가 <b>성조</b>(음의 높낮이)예요. 성조가 다르면 뜻이 완전히 달라져요.</div>
  <h3>4개의 성조 (누르면 들려요)</h3><div class="pgrid">${ex('妈','mā','1성: 높고 평평하게 ─ (엄마)')}${ex('麻','má','2성: 아래에서 위로 ／ (삼베)')}${ex('马','mǎ','3성: 내렸다 올리기 ∨ (말)')}${ex('骂','mà','4성: 위에서 뚝 ＼ (욕하다)')}${ex('吗','ma','경성: 짧고 가볍게 (의문 조사)')}</div>
  <h3>성조 변화 규칙</h3><div class="box small">• <b>3성+3성</b> → 앞 글자가 2성으로: 你好 nǐ hǎo → ní hǎo<br>• <b>不 bù</b> + 4성 → bú: 不是 bú shì, 不客气 bú kè qi<br>• <b>一 yī</b> + 4성 → yí (一下 yí xià), + 1·2·3성 → yì (一点 yì diǎn). 숫자를 셀 때나 서수(第一 dì yī)는 yī 그대로.<br>• 전화번호·방 번호의 1은 보통 <b>yāo</b>로 읽어요.<br>• 이 앱의 병음은 不·一의 바뀐 성조를 표시했어요.</div>
  <h3>성모 (자음)</h3><div class="pgrid">${ini.map(([a,b,c])=>{const [hz,py]=c.split(' ');return `<button class="pex" data-z="${hz}"><b>${a}</b><span>${b}</span><span class="kk">${hz} ${py}</span></button>`;}).join('')}</div>
  <h3>헷갈리기 쉬운 운모 (모음)</h3><div class="box small">• <b>e</b>: '어'에 가까움 — 喝 hē(허)<br>• <b>ü</b> (j·q·x·y 뒤에서는 u로 적음): '위'를 입술 모은 채 — 去 qù(취), 鱼 yú(위)<br>• zhi·chi·shi·ri·zi·ci·si의 <b>i</b>는 '이'가 아니라 '으' — 是 shì(스)<br>• <b>-n</b>은 ㄴ받침, <b>-ng</b>는 ㅇ받침 — 人 rén / 冷 lěng<br>• ian은 '이엔'(옌) — 天 tiān(티엔)</div>
  <div class="pgrid">${ex('喝','hē','허')}${ex('去','qù','취')}${ex('鱼','yú','위')}${ex('是','shì','스')}${ex('天','tiān','티엔')}${ex('人','rén','런')}${ex('冷','lěng','렁')}${ex('谢谢','xiè xie','씨에시에')}</div>`;
  el.querySelector('.back').onclick=()=>go({name:'home'});
  el.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>speak(b.dataset.z));}
// ===== init
function init(){
  $('#langs').innerHTML=Object.entries(LANGS).map(([k,v])=>`<button data-l="${k}">${v.flag} ${v.name}</button>`).join('');
  $('#lvls').innerHTML=Object.entries(LVL).map(([k,v])=>`<button data-v="${k}">${v}</button>`).join('');
  document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;save();if((view.name==='chart'&&S.lang!=='ja')||(view.name==='pinyin'&&S.lang!=='zh'))view={name:'home'};stopSpeak();render();});
  document.querySelectorAll('.lvl button').forEach(b=>b.onclick=()=>{S.level=b.dataset.v;save();stopSpeak();render();});
  document.querySelectorAll('nav.bottom button').forEach(b=>b.onclick=()=>go({name:b.dataset.go}));
  render();
}
init();

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script></body></html>
